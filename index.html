<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="微積分1問題集の一括正誤判定サイト" />
    <title>微積分1 問題集</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB" crossorigin="anonymous" />
    <link rel="stylesheet" href="./src/style.css?v=1.5.1" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs" crossorigin="anonymous"></script>
    <script defer src="./data/questions.js?v=1.3.0"></script>
    <script defer src="./src/judge-core.js?v=1.3.0"></script>
    <script defer src="./src/shared-page.js?v=1.3.0"></script>
    <script defer src="./src/workbook-page.js?v=1.3.0"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <h1>微積分1 問題集</h1>
          <p class="lead">単元を開いて問題を確認し、回答をまとめて提出できます。</p>
        </div>
        <a class="pdf-link" href="./public/微積分1問題集_改訂版.pdf" download>問題集PDFを開く</a>
      </div>
    </header>

    <nav class="mode-switch" aria-label="演習ページ">
      <a class="mode-button is-active" href="./index.html" aria-current="page">問題集</a>
      <a class="mode-button" href="./practice.html">演習</a>
    </nav>

    <main class="layout">
      <section class="problem-pane" aria-labelledby="problem-heading">
        <div class="section-heading">
          <div>
            <p class="section-kicker">PROBLEM SET</p>
            <h2 id="problem-heading">単元一覧</h2>
          </div>
          <span id="question-count" class="count-badge">読み込み中</span>
        </div>
        <p class="unit-guide">単元名をクリックすると、その単元の問題が開きます。</p>
        <div id="problem-list" aria-live="polite"></div>
      </section>

      <aside class="judge-pane" aria-labelledby="judge-heading">
        <div class="judge-card">
          <p class="section-kicker">SUBMISSION</p>
          <h2 id="judge-heading">回答提出</h2>
          <p class="format-description">1行につき「問題番号 回答」の順に入力してください。複数の空欄は半角スペースで区切ります。</p>
          <pre class="sample" aria-label="入力例">1 2
2 -3/2
12 -1 1 連続でない</pre>
          <label for="submission">回答テキスト</label>
          <textarea id="submission" rows="14" spellcheck="false" placeholder="1 2&#10;2 -3/2&#10;3 -4"></textarea>
          <div class="button-row">
            <button id="judge-button" class="primary-button" type="button">一括判定</button>
            <button id="clear-button" class="secondary-button" type="button">クリア</button>
          </div>
          <p class="privacy-note">入力内容は送信・保存されず、このページ内だけで判定されます。</p>
        </div>
        <section id="results" class="results-card" aria-labelledby="results-heading" hidden>
          <p class="section-kicker">VERDICT</p>
          <h2 id="results-heading">判定結果</h2>
          <div id="summary" class="summary-grid"></div>
          <div id="line-errors" class="line-errors"></div>
          <div class="table-wrap"><table><thead><tr><th>問題</th><th>判定</th><th>提出した回答</th></tr></thead><tbody id="result-body"></tbody></table></div>
        </section>
      </aside>
    </main>

    <footer aria-hidden="true"></footer>
  </body>
</html>
